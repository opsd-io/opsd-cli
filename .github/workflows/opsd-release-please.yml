name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  mcp-qualification:
    uses: ./.github/workflows/opsd-mcp-protocol.yml

  release:
    needs: mcp-qualification
    uses: opsd-io/public-workflows/.github/workflows/release-please.yml@main
    with:
      release-type: ruby
      version-file: lib/opsd/version.rb
      component: opsd
      initial-version: 0.1.0
      publish-bundle: true
