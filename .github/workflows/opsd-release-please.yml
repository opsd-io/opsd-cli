name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    uses: opsd-io/public-workflows/.github/workflows/release-please.yml@main
    with:
      release-type: ruby
      version-file: lib/opsd/version.rb
      component: opsd
      initial-version: 1.0.0
      publish-bundle: true
