name: MCP protocol

# Run on every PR: launcher, catalog, dependency, and workflow changes must not
# accidentally bypass protocol qualification through a stale path filter.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-protocol-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: MCP SDK and schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up repository Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1

      - name: Set up locked Python test dependencies
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          python-version: '3.11.12'
          enable-cache: true
          cache-dependency-glob: test/mcp/uv.lock

      - name: Run CLI regression suite
        run: sh scripts/ci/run_unit_cli_tests.sh

      - name: Run official SDK and schema checks
        run: sh scripts/ci/run_mcp_protocol_tests.sh
