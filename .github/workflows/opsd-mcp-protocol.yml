name: MCP protocol

# Run on every PR: launcher, catalog, dependency, and workflow changes must not
# accidentally bypass protocol qualification through a stale path filter.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: mcp-protocol-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: MCP SDK and schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up repository Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1

      - name: Set up locked Python test dependencies
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          python-version: '3.11.12'
          enable-cache: true
          cache-dependency-glob: test/mcp/uv.lock

      - name: Run CLI regression suite
        run: sh scripts/ci/run_unit_cli_tests.sh

      - name: Run official SDK and schema checks
        run: sh scripts/ci/run_mcp_protocol_tests.sh

  qualification:
    name: MCP complete workflows and bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      OPSD_MCP_DIAGNOSTICS: ${{ github.workspace }}/.tmp/mcp-diagnostics
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up repository Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1

      - name: Set up locked Python test dependencies
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          python-version: '3.11.12'
          enable-cache: true
          cache-dependency-glob: test/mcp/uv.lock

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.7'
          terraform_wrapper: false

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: '1.12.6'
          tofu_wrapper: false

      - name: Set up Helm
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Set up kubeconform
        uses: bmuschko/setup-kubeconform@e5d264ec1eafe2314e750c429a9da7639dd5a003 # v1
        with:
          kubeconform-version: '0.7.0'

      - name: Qualify real tools against checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/mcp-diagnostics
          sh scripts/ci/run_mcp_real_tools_tests.sh 2>&1 | tee .tmp/mcp-diagnostics/checkout.log

      - name: Build and qualify extracted portable bundle
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/release/build_portable_bundle.sh 2>&1 | tee .tmp/mcp-diagnostics/bundle.log

      - name: Preserve qualification diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcp-qualification-${{ matrix.os }}
          path: .tmp/mcp-diagnostics
          if-no-files-found: warn
          retention-days: 7
