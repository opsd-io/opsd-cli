apiVersion: opsd.io/modules/v1alpha1
kind: KubernetesModule

metadata:
  id: platform-tools-oci
  name: Platform Tools (OCI)
  description: Provider-neutral platform tools distributed as an OCI chart.

spec:
  layer: tools
  source:
    type: oci
    registry: registry.example.invalid/opsd
    chart: platform-tools
    version: 2.0.1
    digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  defaults: defaults.yaml
  schema: schema.yaml
  ownership:
    type: official
    repository: opsd-io/modules-kubernetes
  supported_providers: [digitalocean, aws, azure, gcp]
  provider_extensions: {}
  validation:
    mode: strict
